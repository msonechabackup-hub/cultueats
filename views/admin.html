<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Craveo - Admin Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-8">
  <div class="max-w-4xl mx-auto space-y-6">
    <div class="flex items-center justify-between border-b border-slate-800 pb-4">
      <h1 class="text-3xl font-black text-amber-500">Craveo Admin Control</h1>
      <a href="/" class="text-xs font-bold bg-slate-800 px-4 py-2 rounded-full">? Back to App</a>
    </div>
    
    <div class="space-y-4">
      <h2 class="text-xl font-bold">Active Listings</h2>
      <div id="admin-listings" class="space-y-3"></div>
    </div>
  </div>

  <script>
    async function loadListings() {
      const res = await fetch('/api/restaurants');
      const data = await res.json();
      const container = document.getElementById('admin-listings');
      container.innerHTML = '';
      data.forEach(r => {
        container.innerHTML += `
          <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex items-center justify-between">
            <div>
              <h3 class="font-bold text-white">${r.name}</h3>
              <p class="text-xs text-slate-400">${r.cuisine} - ${r.city}</p>
            </div>
            <button onclick="deleteListing(${r.id})" class="bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs px-3 py-1.5 rounded-lg transition">Delete Listing</button>
          </div>
        `;
      });
    }

    async function deleteListing(id) {
      if (confirm("Are you sure you want to remove this listing?")) {
        await fetch(`/api/admin/restaurants/${id}`, { method: 'DELETE' });
        loadListings();
      }
    }

    loadListings();
  </script>
</body>
</html>
