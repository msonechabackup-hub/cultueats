<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partner Onboarding - CultuEats</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-stone-50 flex flex-col min-h-screen">
  <main class="max-w-2xl mx-auto px-6 py-12 flex-1 w-full">
    <div class="bg-white p-8 rounded-3xl border border-stone-200 shadow-xl space-y-6">
      <h1 class="text-2xl font-black text-stone-900">Register Your Restaurant</h1>
      <form onsubmit="submitPartnerForm(event)" class="space-y-4 text-xs">
        <div>
          <label class="block font-bold text-stone-700 mb-1">Restaurant Name *</label>
          <input id="p-name" type="text" required class="w-full border p-3 rounded-xl">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block font-bold text-stone-700 mb-1">City *</label>
            <input id="p-city" type="text" required class="w-full border p-3 rounded-xl">
          </div>
          <div>
            <label class="block font-bold text-stone-700 mb-1">Cuisine Type *</label>
            <input id="p-cuisine" type="text" required class="w-full border p-3 rounded-xl">
          </div>
        </div>
        <div>
          <label class="block font-bold text-stone-700 mb-1">Full Address *</label>
          <input id="p-address" type="text" required class="w-full border p-3 rounded-xl">
        </div>
        <div>
          <label class="block font-bold text-stone-700 mb-1">Owner Email *</label>
          <input id="p-email" type="email" required class="w-full border p-3 rounded-xl">
        </div>
        <button type="submit" class="w-full zomato-gradient text-white font-bold py-3.5 rounded-xl">Submit Application</button>
      </form>
    </div>
  </main>
  <script>
    async function submitPartnerForm(e) {
      e.preventDefault();
      const payload = {
        name: document.getElementById('p-name').value,
        city: document.getElementById('p-city').value,
        cuisine: document.getElementById('p-cuisine').value,
        address: document.getElementById('p-address').value,
        ownerEmail: document.getElementById('p-email').value,
      };
      const res = await fetch('/api/partner/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      alert(data.message);
      window.location.href = '/';
    }
  </script>
</body>
</html>
