<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CultuEats - Zomato Style Social Dining</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="flex flex-col min-h-screen">
  <header class="bg-white border-b border-stone-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2.5">
        <div class="w-10 h-10 zomato-gradient rounded-2xl flex items-center justify-center text-white font-black text-xl shadow-md">CE</div>
        <div>
          <span class="text-xl font-black text-stone-900 tracking-tight block leading-none">CultuEats</span>
        </div>
      </a>
      <div class="flex items-center gap-3">
        <a href="/partner" class="text-xs font-bold bg-stone-900 text-amber-400 px-4 py-2.5 rounded-full">+ Add Restaurant</a>
        <a href="/admin" class="text-xs font-bold border border-stone-300 text-stone-700 px-4 py-2.5 rounded-full">?? Admin Panel</a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8 flex-1 w-full space-y-8">
    <div class="bg-stone-900 text-white rounded-3xl p-8 sm:p-12 zomato-gradient shadow-2xl space-y-4">
      <h1 class="text-3xl sm:text-5xl font-black leading-tight">Find & Pre-Order Great Food Near You</h1>
    </div>
    <div class="space-y-4">
      <h2 class="text-2xl font-black text-stone-900">Approved Restaurants</h2>
      <div id="restaurant-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>
  </main>
  <script src="/js/app.js"></script>
</body>
</html>
