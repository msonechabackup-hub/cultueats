<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CultuEats - Social Dining</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    #map { height: 450px !important; width: 100% !important; border-radius: 1.5rem; }
    .zomato-gradient { background: linear-gradient(135deg, #e11d48 0%, #f97316 100%); }
  </style>
</head>
<body class="bg-stone-50 min-h-screen flex flex-col">
  <header class="bg-white border-b border-stone-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2">
        <div class="w-10 h-10 zomato-gradient rounded-xl flex items-center justify-center text-white font-black text-xl">CE</div>
        <span class="text-xl font-black text-stone-900">CultuEats</span>
      </a>
      <div class="flex gap-3">
        <a href="/partner" class="text-xs font-bold bg-stone-900 text-amber-400 px-4 py-2.5 rounded-full">+ Partner</a>
        <a href="/admin" class="text-xs font-bold border border-stone-300 px-4 py-2.5 rounded-full">Admin</a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8 w-full space-y-8 flex-1">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      <!-- Left Column: Restaurant List -->
      <div class="lg:col-span-7 space-y-4">
        <h2 class="text-2xl font-black text-stone-900">Explore Restaurants</h2>
        <div id="restaurant-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <p class="text-xs text-stone-400">Loading restaurants...</p>
        </div>
      </div>

      <!-- Right Column: Leaflet Map -->
      <div class="lg:col-span-5">
        <div class="sticky top-28 space-y-3">
          <h2 class="text-xl font-black text-stone-900">Map View</h2>
          <div id="map" class="shadow-lg border border-stone-200 bg-stone-200"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
