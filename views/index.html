<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Craveo - Fine Dining & Discovery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    #map { height: 420px !important; width: 100% !important; border-radius: 1.5rem; }
    .craveo-gradient { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #431407 100%); }
    .gold-text { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased">
  <header class="border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3">
        <div class="w-10 h-10 craveo-gradient border border-amber-500/30 rounded-xl flex items-center justify-center text-amber-400 font-black text-xl shadow">CR</div>
        <span class="text-2xl font-black tracking-tight gold-text">Craveo</span>
      </a>
      <a href="/admin" class="text-xs font-bold border border-slate-800 hover:border-amber-500/50 px-4 py-2.5 rounded-full transition">🔒 Admin Portal</a>
    </div>
  </header>
  <main class="max-w-7xl mx-auto px-6 py-8 w-full">
    <h1 class="text-3xl font-black text-white">Welcome to Craveo</h1>
  </main>
</body>
</html>
