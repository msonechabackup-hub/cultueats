<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CultuEats - Social Dining & Discovery Map</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    #map { height: 380px; width: 100%; border-radius: 1.5rem; z-index: 10; }
  </style>
</head>
<body class="flex flex-col min-h-screen bg-stone-50">
  <header class="bg-white border-b border-stone-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2.5">
        <div class="w-10 h-10 zomato-gradient rounded-2xl flex items-center justify-center text-white font-black text-xl shadow-md">CE</div>
        <div>
          <span class="text-xl font-black text-stone-900 tracking-tight block leading-none">CultuEats</span>
        </div>
      </a>
      <div class="flex items-center gap-3">
        <a href="/partner" class="text-xs font-bold bg-stone-900 text-amber-400 px-4 py-2.5 rounded-full">+ Partner</a>
        <a href="/admin" class="text-xs font-bold border border-stone-300 text-stone-700 px-4 py-2.5 rounded-full">?? Admin</a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8 flex-1 w-full space-y-8">
    <div class="bg-stone-900 text-white rounded-3xl p-8 sm:p-12 zomato-gradient shadow-2xl space-y-2">
      <h1 class="text-3xl sm:text-5xl font-black leading-tight">Explore Restaurants & Spots</h1>
      <p class="text-amber-100 text-sm">Verified social dining near you.</p>
    </div>

    <!-- Map Section -->
    <div class="space-y-3">
      <h2 class="text-xl font-black text-stone-900">?? Interactive Map</h2>
      <div id="map" class="shadow-md border border-stone-200 bg-stone-200"></div>
    </div>

    <!-- Restaurants Grid Section -->
    <div class="space-y-4">
      <h2 class="text-2xl font-black text-stone-900">Explore Restaurants</h2>
      <div id="restaurant-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
